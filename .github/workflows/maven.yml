name: Build and Deploy the main branch

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Skip Docker Hub and GitHub publish (build the ZIP and print gh commands)
        type: boolean
        default: true
  pull_request:
    types: [labeled]

jobs:
  build-and-deploy:
    if: github.event_name != 'pull_request' || github.event.label.name == 'test-main-workflow'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DRY_RUN: ${{ github.event_name == 'pull_request' || inputs.dry_run == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - name: Fetch origin/main for Spotless ratchet
        run: git fetch origin main --depth=1
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Cache Docker images
        if: env.DRY_RUN != 'true'
        uses: AndreKurait/docker-cache@0.7.0
        with:
          key: fscrawler-docker-cache-${{ runner.os }}-${{ hashFiles('pom.xml') }}
        continue-on-error: true
      - name: Login to Docker Hub
        if: env.DRY_RUN != 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Create Maven settings.xml
        if: env.DRY_RUN != 'true'
        uses: s4u/maven-settings-action@v4.0.0
        with:
          githubServer: false
          servers: '[{"id": "docker.io", "username": "${{ secrets.DOCKER_USERNAME }}", "password": "${{ secrets.DOCKER_PASSWORD }}"}]'
      - name: Build SNAPSHOT ZIP (dry-run)
        if: env.DRY_RUN == 'true'
        run: mvn --batch-mode package -DskipTests -Dossindex.skip -Ddocker.skip
      - name: Deploy Docker images
        if: env.DRY_RUN != 'true'
        run: mvn --batch-mode deploy -DskipTests -Dossindex.skip
      - name: Publish SNAPSHOT ZIP as GitHub pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/publish_snapshot_prerelease.py ${{ env.DRY_RUN == 'true' && '--dry-run' || '' }}
